version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # These two cannot move without breaking the build. Each ignore is scoped to
    # an update-type on purpose: a bare `dependency-name` ignore also suppresses
    # Dependabot SECURITY updates for that package, which we never want. Security
    # PRs are enabled in repo settings and are not filtered by these rules.
    ignore:
      # v1 removed every brand icon; src/components/SocialLink.tsx imports
      # Github and Linkedin, so the build fails on a major.
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      # typescript-eslint peers on `>=4.8.4 <6.1.0`, so 6.1 and 7.x both break
      # `npm run lint`. Patches within 6.0.x still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
